# START COMPUTE SECTION - Grace


  #Added LoadBalancerAttributes section to enable ALB access logs to be sent to the S3 logs bucket
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: enrolline-alb
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      LoadBalancerAttributes:
        - Key: access_logs.s3.enabled
          Value: "true"
        - Key: access_logs.s3.bucket
          Value: !Ref LogsBucket
        - Key: access_logs.s3.prefix
          Value: alb-access-logs
        
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: enrolline-alb
    DependsOn: PublicRoute

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: enrolline-tg
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      UnhealthyThresholdCount: 2
      Tags:
        - Key: Name
          Value: enrolline-tg

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: enrolline-launch-template
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref AppInstanceType
        IamInstanceProfile:
          Name: !Ref InstanceProfileName
        SecurityGroupIds:
          - !Ref AppSecurityGroup
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              VolumeSize: 8
              DeleteOnTermination: true
              Encrypted: true
        MetadataOptions:
          HttpTokens: required

        # The following user data defines a placeholder web page using apache to
        # preserve the tech stack and so that health checks can pass.
        
        UserData:
          Fn::Base64: |
            #!/bin/bash
            dnf install -y httpd
            echo "Enrolline woz 'ere" > /var/www/html/index.html
            systemctl enable --now httpd
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: enrolline-app
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: enrolline-app

# Increased the ASG max capacity to 4. Configured the ASG to place instances in AppSubnetB.
  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn:
      - Listener
      - AppRoute
    Properties:
      AutoScalingGroupName: enrolline-asg
      MinSize: '1'
      DesiredCapacity: '1'
      MaxSize: '4'
      VPCZoneIdentifier:
        - !Ref AppSubnetA
        - !Ref AppSubnetB
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      TargetGroupARNs:
        - !Ref TargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Name
          Value: enrolline-app
          PropagateAtLaunch: true

  ScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 70

  # The scheduled scaling policy that keeps the instances at max capacity during the intake, census and AVETMISS submission periods. The ASG's desired capacity is raised from 1 to 4 from 1st Jan - 7th Mar and 26th June - 4th Aug
  ScheduledScaleUpJanPolicy:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      Recurrence: "0 0 1 1 *"
      MinSize: 1
      MaxSize: 4
      DesiredCapacity: 4

  ScheduledScaleDownMarPolicy:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      Recurrence: "0 0 8 3 *"
      MinSize: 1
      MaxSize: 4
      DesiredCapacity: 1

  ScheduledScaleUpJunPolicy:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      Recurrence: "0 0 26 6 *"
      MinSize: 1
      MaxSize: 4
      DesiredCapacity: 4

  ScheduledScaleDownAugPolicy:
    Type: AWS::AutoScaling::ScheduledAction
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      Recurrence: "0 0 5 8 *"
      MinSize: 1
      MaxSize: 4
      DesiredCapacity: 1

# END COMPUTE SECTION - Grace
